<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Panel | Dulce Equilibrio</title>
  <link rel="stylesheet" href="/admin/recursos/panel.css">
</head>
<body>
  <div class="app">
    <aside class="lateral">
      <a class="marca" href="/admin">Dulce Equilibrio</a>
      <nav class="menu" aria-label="Secciones del panel">
        <button type="button" data-vista="resumen"><span class="icono" aria-hidden="true">🏠</span><span>Resumen</span></button>
        <button type="button" data-vista="mensajes"><span class="icono" aria-hidden="true">✉️</span><span>Mensajes</span><span class="insignia" id="insigniaMensajes" hidden></span></button>
        <button type="button" data-vista="pedidos"><span class="icono" aria-hidden="true">🧾</span><span>Pedidos</span></button>
        <button type="button" data-vista="productos"><span class="icono" aria-hidden="true">🍰</span><span>Productos</span></button>
      </nav>
    </aside>

    <div class="principal">
      <header class="barra">
        <h1 id="titulo">Resumen</h1>
        <div class="barra-acciones">
          <a class="boton boton-suave" href="/" target="_blank" rel="noopener">Ver sitio</a>
          <button type="button" class="boton boton-suave" id="botonSalir">Salir</button>
        </div>
      </header>
      <main id="contenido" tabindex="-1" aria-live="polite"></main>
    </div>
  </div>

  <dialog id="dialogo" aria-labelledby="dialogoTitulo"></dialog>
  <div id="aviso" role="status" aria-live="polite" hidden></div>

  <script src="/admin/recursos/panel.js"></script>
</body>
</html>
